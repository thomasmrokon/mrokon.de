name: Analytics Log Processing

on:
  # Manueller Trigger für Log-Upload und -Verarbeitung
  workflow_dispatch:
    inputs:
      log_file:
        description: 'Name der hochgeladenen Log-Datei (optional)'
        required: false
        type: string
  
  # Automatischer Trigger jeden Sonntag um 2 Uhr
  schedule:
    - cron: '0 2 * * 0'

jobs:
  process-logs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Dependencies
      run: |
        cd analytics
        npm install
    
    - name: Check for Log Files
      id: check_logs
      run: |
        if [ -d "analytics/logs" ] && [ "$(ls -A analytics/logs)" ]; then
          echo "logs_found=true" >> $GITHUB_OUTPUT
          echo "Log-Dateien gefunden:"
          ls -la analytics/logs/
        else
          echo "logs_found=false" >> $GITHUB_OUTPUT
          echo "Keine Log-Dateien gefunden"
        fi
    
    - name: Process Analytics Logs
      if: steps.check_logs.outputs.logs_found == 'true'
      run: |
        cd analytics
        node process-logs.js
    
    - name: Commit Results
      if: steps.check_logs.outputs.logs_found == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Prüfen ob Änderungen vorhanden sind
        if [ -n "$(git status --porcelain)" ]; then
          git add data/analytics.json
          git add analytics/processed/
          git commit -m "Analytics: Update statistics $(date +'%Y-%m-%d %H:%M')"
          git push
          echo "Analytics-Daten aktualisiert und committed"
        else
          echo "Keine Änderungen an Analytics-Daten"
        fi
    
    - name: Archive Processed Logs
      if: steps.check_logs.outputs.logs_found == 'true'
      run: |
        # Verarbeitete Logs ins processed-Verzeichnis verschieben
        mkdir -p analytics/processed/$(date +'%Y-%m')
        mv analytics/logs/* analytics/processed/$(date +'%Y-%m')/
        echo "Logs archiviert in analytics/processed/$(date +'%Y-%m')/"
    
    - name: Cleanup Old Archives
      run: |
        # Lösche Archive älter als 6 Monate
        find analytics/processed -type d -name "????-??" -mtime +180 -exec rm -rf {} + 2>/dev/null || true
        echo "Alte Archive bereinigt"
    
    - name: Generate Summary
      if: steps.check_logs.outputs.logs_found == 'true'
      run: |
        echo "## Analytics Processing Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Datum:** $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "- **Verarbeitete Logs:** $(ls analytics/processed/$(date +'%Y-%m')/ 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "- **Status:** ✅ Erfolgreich verarbeitet" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "data/analytics.json" ]; then
          echo "- **Analytics-Datei:** Aktualisiert" >> $GITHUB_STEP_SUMMARY
        fi
